# .github/workflows/rules-of-hooks.yml
#
# Fails a PR (and flags main) when a React hook is called conditionally or
# after an early return — the bug class that took the web owner dashboard down
# for every tenant on 2026-09-03. See eslint.hooks.config.mjs for the rule and
# for why this runs here rather than as a package.json script (scripts are a
# fingerprint input; adding one would move the OTA lane).
#
# Mobile JS ships by `eas update`, which runs nothing from this repo first, so
# this check is the gate. Run the same command locally before publishing.

name: Rules of Hooks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules-of-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: ESLint needs no native postinstalls (sharp, expo), and
      # skipping them keeps a flaky binary download from failing a lint check.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint --config eslint.hooks.config.mjs --no-config-lookup --max-warnings 0 .
